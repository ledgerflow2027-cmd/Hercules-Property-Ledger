<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Ledgerly - Settings, Help, About and languages</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      :root {
        --widget-page: #fdfdfc;
        --widget-card: #ffffff;
        --widget-border: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --widget-page: #141310;
          --widget-card: #201e1a;
          --widget-border: rgba(255, 255, 255, 0.1);
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--widget-page);
      }
      body {
        padding: 16px;
        box-sizing: border-box;
      }
      #hercules-widget-root {
        background: var(--widget-card);
        border: 1px solid var(--widget-border);
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="hercules-widget-root" style="max-width: 680px; margin: 0 auto; width: 100%">
<h2 class="sr-only">Mockup: Settings and Language buttons, About page, Help guide, and English, Arabic and Urdu translation</h2>
<div id="app" class="font-sans text-zinc-900 dark:text-zinc-100 space-y-3" style="font-weight:300">
  <div class="flex flex-col gap-2">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 font-semibold text-base"><i class="ti ti-building-estate text-violet-600 dark:text-violet-300" aria-hidden="true"></i><span data-i="brand"></span></div>
      <div class="relative">
        <button id="langBtn" class="rounded-full bg-gradient-to-r from-yellow-200 to-emerald-200 dark:from-yellow-900 dark:to-emerald-900 px-3 py-1.5 text-sm font-medium" aria-haspopup="true"><i class="ti ti-language" aria-hidden="true"></i> <span id="langLbl"></span></button>
        <div id="langMenu" class="hidden absolute end-0 top-10 z-10 w-40 rounded-3xl bg-white dark:bg-zinc-800 shadow p-1">
          <button data-l="en" class="lo w-full text-start rounded-full px-3 py-2">English</button>
          <button data-l="ar" class="lo w-full text-start rounded-full px-3 py-2">العربية</button>
          <button data-l="ur" class="lo w-full text-start rounded-full px-3 py-2">اردو</button>
        </div>
      </div>
    </div>
    <nav class="grid grid-cols-4 gap-1 p-1 rounded-full bg-gradient-to-r from-violet-100 via-blue-100 to-emerald-100 dark:from-violet-950 dark:via-blue-950 dark:to-emerald-950" aria-label="Main">
      <button data-t="dash" class="tab"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span data-i="dash"></span></button>
      <button data-t="prop" class="tab"><i class="ti ti-home" aria-hidden="true"></i><span data-i="prop"></span></button>
      <button data-t="stmt" class="tab"><i class="ti ti-file-text" aria-hidden="true"></i><span data-i="stmt"></span></button>
      <button data-t="set" class="tab"><i class="ti ti-settings" aria-hidden="true"></i><span data-i="set"></span></button>
    </nav>
  </div>

  <section id="dash" class="pane space-y-3">
    <h3 class="hd" data-i="welcome"></h3>
    <div class="grid grid-cols-2 gap-2">
      <div class="rounded-3xl p-4 bg-gradient-to-br from-emerald-200 to-blue-200 dark:from-emerald-900 dark:to-blue-900"><div class="opacity-75" data-i="income"></div><div class="font-semibold">$45,770</div></div>
      <div class="rounded-3xl p-4 bg-gradient-to-br from-violet-200 to-blue-200 dark:from-violet-900 dark:to-blue-900"><div class="opacity-75" data-i="expense"></div><div class="font-semibold">$12,340</div></div>
      <div class="rounded-3xl p-4 bg-gradient-to-br from-emerald-200 to-yellow-200 dark:from-emerald-900 dark:to-yellow-900"><div class="opacity-75" data-i="profit"></div><div class="font-semibold">$33,430</div></div>
      <div class="rounded-3xl p-4 bg-gradient-to-br from-yellow-200 to-violet-200 dark:from-yellow-900 dark:to-violet-900"><div class="opacity-75" data-i="due"></div><div class="font-semibold">$2,100</div></div>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button class="rounded-3xl p-4 text-start bg-gradient-to-br from-emerald-300 to-emerald-100 dark:from-emerald-800 dark:to-emerald-950"><i class="ti ti-circle-plus text-2xl" aria-hidden="true"></i><div class="font-semibold" data-i="addInc"></div></button>
      <button class="rounded-3xl p-4 text-start bg-gradient-to-br from-violet-300 to-violet-100 dark:from-violet-800 dark:to-violet-950"><i class="ti ti-circle-minus text-2xl" aria-hidden="true"></i><div class="font-semibold" data-i="addExp"></div></button>
    </div>
    <p class="opacity-70 text-sm" data-i="note"></p>
  </section>

  <section id="prop" class="pane hidden"><div class="rounded-3xl p-6 bg-gradient-to-br from-violet-100 to-blue-100 dark:from-violet-950 dark:to-blue-950" data-i="same"></div></section>
  <section id="stmt" class="pane hidden"><div class="rounded-3xl p-6 bg-gradient-to-br from-emerald-100 to-violet-100 dark:from-emerald-950 dark:to-violet-950" data-i="same"></div></section>

  <section id="set" class="pane hidden space-y-3">
    <div class="grid grid-cols-3 gap-1 p-1 rounded-full bg-white/70 dark:bg-zinc-800/70">
      <button data-s="general" class="st"><span data-i="general"></span></button><button data-s="help" class="st"><span data-i="help"></span></button><button data-s="about" class="st"><span data-i="about"></span></button>
    </div>

    <div id="general" class="sp space-y-2">
      <div class="rounded-3xl p-4 bg-gradient-to-br from-violet-100 to-blue-100 dark:from-violet-950 dark:to-blue-950 flex justify-between items-center gap-2"><span data-i="language"></span><span id="langCur" class="font-medium"></span></div>
      <div class="rounded-3xl p-4 bg-gradient-to-br from-blue-100 to-emerald-100 dark:from-blue-950 dark:to-emerald-950 flex justify-between items-center gap-2"><span data-i="currency"></span><select class="rounded-full bg-white/80 dark:bg-zinc-800 px-3 py-1.5"><option>USD $</option><option>AED</option><option>SAR</option><option>PKR</option></select></div>
      <div class="rounded-3xl p-4 bg-gradient-to-br from-emerald-100 to-yellow-100 dark:from-emerald-950 dark:to-yellow-950 flex justify-between items-center gap-2"><span data-i="profile"></span><i class="ti ti-chevron-right rtl:rotate-180" aria-hidden="true"></i></div>
      <div class="rounded-3xl p-4 bg-gradient-to-br from-yellow-100 to-violet-100 dark:from-yellow-950 dark:to-violet-950 flex justify-between items-center gap-2"><span data-i="acct"></span><i class="ti ti-chevron-right rtl:rotate-180" aria-hidden="true"></i></div>
    </div>

    <div id="help" class="sp hidden space-y-2">
      <h3 class="hd" data-i="helpTitle"></h3>
      <ol id="steps" class="space-y-2"></ol>
    </div>

    <div id="about" class="sp hidden">
      <div class="rounded-3xl p-6 text-center space-y-3 bg-gradient-to-br from-violet-200 via-blue-200 to-emerald-200 dark:from-violet-900 dark:via-blue-900 dark:to-emerald-900">
        <div class="mx-auto h-28 w-28 rounded-full ring-4 ring-white dark:ring-zinc-800 bg-gradient-to-br from-yellow-200 to-violet-300 dark:from-yellow-800 dark:to-violet-800 grid place-items-center text-3xl font-semibold" aria-label="Photo of M.Saqib">MS</div>
        <div><div class="hd">M.Saqib</div><div class="opacity-75" data-i="role"></div></div>
        <p data-i="thanks1"></p>
        <p data-i="thanks2"></p>
        <div class="text-xs opacity-60" data-i="ver"></div>
      </div>
    </div>
  </section>
</div>
<script>
const T={
en:{dir:"ltr",name:"English",font:"'Lexend','Segoe UI',system-ui,sans-serif",body:"16px",head:"28px",
 brand:"Ledgerly",dash:"Dashboard",prop:"Property",stmt:"Statements",set:"Settings",welcome:"Welcome back",income:"Income",expense:"Expenses",profit:"Profit",due:"Rent due",addInc:"Add income",addExp:"Add expense",
 note:"Sample data. Property and Statements pages are the same as the previous preview, fully translated.",same:"Same as the previous preview, fully translated into the chosen language.",
 general:"General",help:"Help",about:"About",language:"Language",currency:"Currency",profile:"My profile",acct:"Accountant access",helpTitle:"Getting started",
 steps:[["Sign in","Tap Sign in and use your email or Google account."],["Add a property","Go to Property, tap Add, enter details and upload photos."],["Add a tenant","Open the property, add the tenant, lease, rent and deposit."],["Record income and expenses","Tap Add income or Add expense, pick a quick title and save."],["View statements","Open Statements, choose filters to see your numbers."],["Print or share","Tap Preview to check, then Print, Download or Share the PDF."]],
 role:"CEO and Developer",thanks1:"Thank you to M.Saqib for designing and building this app with care for every property owner.",thanks2:"His vision makes bookkeeping simple, clear and stress-free for everyone.",ver:"Version 1.0"},
ar:{dir:"rtl",name:"العربية",font:"'Tajawal','Noto Sans Arabic',system-ui,sans-serif",body:"17px",head:"30px",
 brand:"ليدجرلي",dash:"لوحة التحكم",prop:"العقار",stmt:"الكشوفات",set:"الإعدادات",welcome:"مرحبًا بعودتك",income:"الدخل",expense:"المصروفات",profit:"الربح",due:"إيجار مستحق",addInc:"إضافة دخل",addExp:"إضافة مصروف",
 note:"بيانات تجريبية. صفحتا العقار والكشوفات مثل المعاينة السابقة ومترجمتان بالكامل.",same:"مثل المعاينة السابقة، ومترجمة بالكامل إلى اللغة المختارة.",
 general:"عام",help:"المساعدة",about:"حول",language:"اللغة",currency:"العملة",profile:"ملفي الشخصي",acct:"وصول المحاسب",helpTitle:"البدء",
 steps:[["تسجيل الدخول","اضغط تسجيل الدخول واستخدم بريدك أو حساب جوجل."],["إضافة عقار","اذهب إلى العقار، اضغط إضافة، أدخل التفاصيل وارفع الصور."],["إضافة مستأجر","افتح العقار وأضف المستأجر والعقد والإيجار والتأمين."],["تسجيل الدخل والمصروفات","اضغط إضافة دخل أو إضافة مصروف، اختر عنوانًا سريعًا واحفظ."],["عرض الكشوفات","افتح الكشوفات واختر عوامل التصفية لرؤية أرقامك."],["الطباعة أو المشاركة","اضغط معاينة للتحقق، ثم اطبع أو نزّل أو شارك ملف PDF."]],
 role:"الرئيس التنفيذي والمطوّر",thanks1:"شكرًا لـ م. ثاقب على تصميم وبناء هذا التطبيق بعناية لكل مالك عقار.",thanks2:"رؤيته تجعل مسك الدفاتر بسيطًا وواضحًا وخاليًا من التوتر للجميع.",ver:"الإصدار 1.0"},
ur:{dir:"rtl",name:"اردو",font:"'Alvi Nastaleeq','Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif",body:"20px",head:"34px",weight:"700",lh:"2.1",
 brand:"لیجرلی",dash:"ڈیش بورڈ",prop:"پراپرٹی",stmt:"گوشوارے",set:"ترتیبات",welcome:"خوش آمدید",income:"آمدنی",expense:"اخراجات",profit:"منافع",due:"واجب الادا کرایہ",addInc:"آمدنی شامل کریں",addExp:"خرچ شامل کریں",
 note:"نمونہ ڈیٹا۔ پراپرٹی اور گوشوارے کے صفحات پچھلے پیش نظارہ جیسے ہیں اور مکمل ترجمہ شدہ ہیں۔",same:"پچھلے پیش نظارہ جیسا، منتخب زبان میں مکمل ترجمہ شدہ۔",
 general:"عمومی",help:"مدد",about:"تعارف",language:"زبان",currency:"کرنسی",profile:"میری پروفائل",acct:"اکاؤنٹنٹ کی رسائی",helpTitle:"آغاز کیسے کریں",
 steps:[["سائن ان","سائن ان دبائیں اور اپنی ای میل یا گوگل اکاؤنٹ استعمال کریں۔"],["پراپرٹی شامل کریں","پراپرٹی میں جائیں، شامل کریں دبائیں، تفصیلات اور تصاویر ڈالیں۔"],["کرایہ دار شامل کریں","پراپرٹی کھولیں، کرایہ دار، معاہدہ، کرایہ اور ڈپازٹ درج کریں۔"],["آمدنی اور اخراجات","آمدنی یا خرچ شامل کریں دبائیں، فوری عنوان چنیں اور محفوظ کریں۔"],["گوشوارے دیکھیں","گوشوارے کھولیں اور فلٹر چن کر اپنے اعداد دیکھیں۔"],["پرنٹ یا شیئر","پیش نظارہ دبا کر دیکھیں، پھر پی ڈی ایف پرنٹ، ڈاؤن لوڈ یا شیئر کریں۔"]],
 role:"سی ای او اور ڈویلپر",thanks1:"ایم ثاقب کا شکریہ جنہوں نے ہر پراپرٹی مالک کے لیے یہ ایپ محبت سے بنائی۔",thanks2:"ان کا وژن حساب کتاب کو سب کے لیے آسان، واضح اور بے فکر بناتا ہے۔",ver:"ورژن 1.0"}};
let lang="en",tab="dash",sub="general";const $=id=>document.getElementById(id);
function apply(){const L=T[lang],app=$("app");app.dir=L.dir;app.style.fontFamily=L.font;app.style.fontSize=L.body;app.style.fontWeight=L.weight||"300";app.style.lineHeight=L.lh||"1.6";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=L[e.dataset.i]);
 document.querySelectorAll(".hd").forEach(h=>{h.style.fontSize=L.head;h.style.fontWeight=lang==="ur"?"700":"500";});
 $("langLbl").textContent=L.name;$("langCur").textContent=L.name;
 $("steps").innerHTML="";L.steps.forEach(([h,d],i)=>{const li=document.createElement("li");li.className="rounded-3xl p-4 flex gap-3 bg-gradient-to-br "+["from-violet-100 to-blue-100 dark:from-violet-950 dark:to-blue-950","from-blue-100 to-emerald-100 dark:from-blue-950 dark:to-emerald-950","from-emerald-100 to-yellow-100 dark:from-emerald-950 dark:to-yellow-950"][i%3];
  const n=document.createElement("span");n.className="h-8 w-8 shrink-0 rounded-full bg-violet-600 text-white grid place-items-center text-sm";n.textContent=String(i+1);
  const b=document.createElement("div");const t=document.createElement("div");t.className="font-medium";t.textContent=h;const p=document.createElement("div");p.className="opacity-75";p.textContent=d;b.append(t,p);li.append(n,b);$("steps").append(li);});
 document.querySelectorAll(".lo").forEach(b=>b.className="lo w-full text-start rounded-full px-3 py-2 "+(b.dataset.l===lang?"bg-violet-600 text-white":""));}
function show(){document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("hidden",p.id!==tab));
 document.querySelectorAll(".tab").forEach(b=>{const on=b.dataset.t===tab;b.setAttribute("aria-current",on?"page":"false");b.className="tab w-full flex flex-col items-center justify-center gap-0.5 rounded-full px-1 py-2.5 text-xs font-medium "+(on?"bg-violet-600 text-white shadow":"bg-white/70 dark:bg-zinc-800/70");});
 document.querySelectorAll(".sp").forEach(p=>p.classList.toggle("hidden",p.id!==sub));
 document.querySelectorAll(".st").forEach(b=>b.className="st rounded-full py-2 text-sm "+(b.dataset.s===sub?"bg-violet-600 text-white":""));}
$("langBtn").onclick=()=>$("langMenu").classList.toggle("hidden");
document.querySelectorAll(".lo").forEach(b=>b.onclick=()=>{lang=b.dataset.l;$("langMenu").classList.add("hidden");apply();});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;show();});
document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{sub=b.dataset.s;show();});
apply();show();
</script>
    </div>
  </body>
</html>
